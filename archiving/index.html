<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독서 아카이브 | 강동인</title>
<meta name="description" content="HR 매니저 강동인이 읽은 AI·경영 분야 책을 정리하는 독서 아카이브">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #1E3326;
    --ink-soft: #4F6357;
    --marigold: #F3B73B;
    --marigold-deep: #C98A0C;
    --leaf-tint: #EEF4EE;
    --line: #DCE4DD;
    --serif: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #13201A; --ink: #E8EFE9; --ink-soft: #A9B8AD;
      --marigold: #F3B73B; --marigold-deep: #F6C865;
      --leaf-tint: #1B2C23; --line: #2C3F33;
    }
  }
  :root[data-theme="dark"] {
    --paper: #13201A; --ink: #E8EFE9; --ink-soft: #A9B8AD;
    --marigold: #F3B73B; --marigold-deep: #F6C865;
    --leaf-tint: #1B2C23; --line: #2C3F33;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.75;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 18px; text-decoration: none; }
  .nav { display: flex; gap: 22px; font-size: 15px; }
  .nav a { text-decoration: none; color: var(--ink-soft); padding: 4px 0; }
  .nav a:hover, .nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--marigold); }

  .page-head { background: var(--marigold); color: #1E3326; }
  .page-head .wrap { padding-top: 72px; padding-bottom: 56px; }
  .page-head h1 {
    font-family: var(--serif); font-weight: 700; margin: 0 0 12px;
    font-size: clamp(30px, 5vw, 44px); line-height: 1.25; letter-spacing: -0.02em;
  }
  .page-head p { margin: 0; max-width: 38em; font-size: 17px; line-height: 1.8; }

  main section { padding: 64px 0; }

  .empty {
    border: 1px dashed var(--line); border-radius: 16px; padding: 48px 32px;
    text-align: center; color: var(--ink-soft); background: var(--leaf-tint);
  }
  .empty .icon { font-size: 32px; margin-bottom: 12px; }
  .empty h2 { font-family: var(--serif); color: var(--ink); font-size: 22px; margin: 0 0 8px; }
  .empty p { margin: 0; }

  .archive-list { list-style: none; margin: 32px 0 0; padding: 0; display: grid; gap: 20px; }
  .archive-list li { border-bottom: 1px solid var(--line); padding-bottom: 20px; }
  .archive-list .meta { font-size: 14px; color: var(--ink-soft); }
  .archive-list h3 { font-size: 18px; margin: 4px 0 6px; }

  .back { display: inline-block; margin-top: 32px; text-decoration: none; font-weight: 600; color: var(--ink-soft); }
  .back:hover { color: var(--ink); }

  footer { padding: 32px 0 48px; font-size: 14px; color: var(--ink-soft); border-top: 1px solid var(--line); }

  @media (max-width: 420px) { .brand { font-size: 16px; } .nav a:nth-child(3) { display: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/">🍀 강동인</a>
    <nav class="nav" aria-label="사이트 메뉴">
      <a href="/">포트폴리오</a>
      <a href="/hr/">HR 뉴스 아카이브</a>
      <a href="/archiving/" aria-current="page">독서 아카이브</a>
      <a href="/#contact">연락하기</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="wrap">
      <h1>독서 아카이브</h1>
      <p>AI·경영 분야를 중심으로 읽은 책과 기록을 정리하는 공간입니다.</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="empty">
        <div class="icon">🍀</div>
        <h2>콘텐츠 준비 중</h2>
        <p>읽은 책 목록과 기록을 정리해 곧 채울 예정입니다.</p>
      </div>

      <!--
        아카이브 항목 추가 예시:
        <ul class="archive-list">
          <li>
            <div class="meta">2026.09 · 경영</div>
            <h3>책 제목</h3>
            <p>한 줄 요약이나 코멘트를 적습니다.</p>
          </li>
        </ul>
      -->

      <a class="back" href="/">← 포트폴리오로 돌아가기</a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© 2026 강동인 · dongin1101.github.io</div>
</footer>

</body>
</html>
